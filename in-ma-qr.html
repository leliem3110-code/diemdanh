<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>In mã QR điểm danh</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#15202b;background:#fff}
.form{max-width:720px;margin:24px auto;padding:0 18px;display:grid;gap:12px}
label{font-weight:600;display:grid;gap:4px}
input{font:inherit;padding:10px 12px;border:1px solid #cfd8df;border-radius:10px}
button{font:inherit;font-weight:700;padding:12px 16px;border:0;border-radius:12px;background:#c8102e;color:#fff;cursor:pointer}
.sheet{width:190mm;margin:10mm auto;border:2px solid #15202b;border-radius:12px;padding:12mm;text-align:center;page-break-after:always}
.sheet h1{font-size:30px;margin:0 0 4px}
.sheet h2{font-size:22px;margin:0 0 14px;color:#c8102e}
.qr{display:inline-block;padding:10px;background:#fff}
.code{font-size:44px;font-weight:800;letter-spacing:8px;margin:10px 0}
.sheet p{font-size:17px;margin:6px 0}
@media print{.form{display:none}.sheet{margin:0 auto;border-width:1px}}
</style>
</head>
<body>
<div class="form">
  <h1 style="margin:0">In mã QR điểm danh</h1>
  <p style="margin:0">Lấy mã 6 số ở trang <b>CauHinh</b> của Google Trang tính (dòng DiemChinh_Ma và PhanHieu_Ma). Mỗi điểm trường in một tờ, dán ở phòng hội đồng.</p>
  <label>Địa chỉ trang điểm danh<input id="url"></label>
  <label>Mã 6 số Điểm chính<input id="c" inputmode="numeric" maxlength="6"></label>
  <label>Mã 6 số Phân hiệu<input id="p" inputmode="numeric" maxlength="6"></label>
  <button id="make">Tạo mã QR</button>
  <button id="print" style="background:#1f5f8b">In</button>
  <p id="err" style="color:#c8102e;margin:0"></p>
</div>
<div id="out"></div>
<script>
{
const $ = s => document.querySelector(s);
$('#url').value = location.href.replace(/in-ma-qr\.html.*$/, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#make').onclick = () => {
  const base = $('#url').value.trim(), out = $('#out');
  out.innerHTML = '';
  $('#err').textContent = '';
  if (typeof QRCode === 'undefined') { $('#err').textContent = 'Không tải được thư viện tạo mã QR. Kiểm tra mạng rồi tải lại trang.'; return; }
  [['Điểm chính', 'ấp Thạnh Xuân', $('#c').value.trim()], ['Phân hiệu', 'ấp Thạnh Phú', $('#p').value.trim()]].forEach(([ten, ap, code]) => {
    if (!/^\d{6}$/.test(code)) { $('#err').textContent = 'Mã của ' + ten + ' phải gồm 6 chữ số.'; return; }
    const link = base + (base.includes('?') ? '&' : '?') + 'k=' + code;
    const div = document.createElement('div');
    div.className = 'sheet';
    div.innerHTML = `<h1>ĐIỂM DANH GIÁO VIÊN</h1><h2>${esc(ten)} · ${esc(ap)}</h2><div class="qr"></div><div class="code">${esc(code)}</div>
      <p>Mở Camera điện thoại, quét mã, chạm vào đường dẫn hiện ra.</p><p>Không quét được: mở ứng dụng Điểm danh, nhập 6 số ở trên.</p>
      <p style="font-size:13px;color:#5b6875">Không chụp, không gửi mã này cho người khác. Lượt quét ngoài khuôn viên trường bị từ chối.</p>`;
    out.appendChild(div);
    new QRCode(div.querySelector('.qr'), {text: link, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M});
  });
};
$('#print').onclick = () => window.print();
}
</script>
</body>
</html>
